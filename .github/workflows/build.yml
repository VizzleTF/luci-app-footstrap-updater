name: Build luci-app-footstrap-updater

# Noarch package (LUCI_PKGARCH:=all): one build per format covers every target.
#   apk — OpenWrt 25.12+ (latest 25.12.x SDK) ; ipk — OpenWrt 24.10 (latest 24.10.x SDK)
#
# Since the theme/updater split this repo builds and releases the updater ALONE, with its own tags.
# The updater DEPENDS on +luci-theme-footstrap, so the build clones the theme repo into the SDK feed
# purely to resolve that dependency — only the updater asset is uploaded.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # the theme repo, cloned in the build job only to satisfy +luci-theme-footstrap
  THEME_REPO: https://github.com/VizzleTF/luci-theme-footstrap
  THEME_REF: main

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          set -eu
          for f in install.sh tools/*.sh \
                   luci-app-footstrap-updater/*.sh \
                   luci-app-footstrap-updater/root/usr/libexec/*.sh; do
            [ -f "$f" ] || continue
            sh -n "$f" || { echo "syntax error: $f"; exit 1; }
          done

      - name: The SDK can see the package at all
        run: sh tools/scan-marker.sh

      # rpcd SKIPS an acl.d file it cannot parse and says nothing: a trailing comma means the file.exec
      # grant is given to nobody, and the Update button dies for every user with no build error.
      - name: rpcd ACL is valid JSON
        run: |
          set -eu
          for f in luci-app-footstrap-updater/root/usr/share/rpcd/acl.d/*.json; do
            python3 -m json.tool "$f" >/dev/null || { echo "invalid JSON: $f"; exit 1; }
            echo "ok: $f"
          done

      # The release public key exists TWICE and neither copy can go: the package ships it (the
      # self-updater reads it off disk) and install.sh embeds it (it runs from `curl | sh` before any
      # package exists). A divergence looks exactly like the attack the key stops — the installer would
      # reject every release with "BAD SIGNATURE" — so compare them. One key signs theme + updater.
      - name: The installer embeds the key the package ships
        run: |
          set -eu
          pub=luci-app-footstrap-updater/root/usr/share/luci-app-footstrap-updater/release.pub
          want=$(grep -v '^untrusted comment:' "$pub" | tr -d '\n')
          [ -n "$want" ] || { echo "no key line in $pub"; exit 1; }
          got=$(grep -oE 'RW[A-Za-z0-9+/=]{40,}' install.sh | sort -u)
          [ "$got" = "$want" ] || {
            echo "install.sh embeds a different release key than the package ships"
            echo "  package:   $want"
            echo "  installer: ${got:-<none>}"
            exit 1
          }
          echo "release key matches in both copies."

      # A _() string with no translation renders in English, silently. Fails if the .pot is stale or a
      # msgstr is empty.
      - name: i18n (translation catalogue current and complete)
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          luci-app-footstrap-updater/update-po.sh --check

  lint:
    name: Lint + JS safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: ESLint (updater JS)
        run: npm run lint:js

      # @mirror: install.sh and footstrap-selfupdate.sh cannot share a file (the installer is
      # `curl | sh` and runs before the package that would hold a library exists), so their fetch /
      # host-allowlist / asset-lookup / verify-sig helpers are pinned byte-identical.
      - name: "@mirror (pinned duplication stays byte-identical)"
        run: npm run mirror

      - name: Changelog contract
        run: npm run changelog

      # THE GATE THAT MAKES SHIPPING MINIFIED JS SAFE. luci.mk minifies fs-update.js with jsmin, whose
      # regex-vs-division test is a ONE-char lookback: `return /re/` can make it swallow the rest of the
      # file WHILE EXITING 0 (openwrt/luci#8299). Build the exact jsmin from the pinned luci-base source
      # and prove the minified output is token-identical to the source. eslint's wrap-regex stops the
      # shape being written; this proves it never got through. Pinned by commit + sha256 (luci-upstream.pin).
      - name: Build jsmin (the same one the buildbot uses)
        run: |
          set -eu
          . ./luci-upstream.pin
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/jsmin.c \
            "https://raw.githubusercontent.com/openwrt/luci/$LUCI_PIN/modules/luci-base/src/jsmin.c"
          echo "$JSMIN_SHA256  /tmp/jsmin.c" | sha256sum -c -
          cc -O2 -o /tmp/jsmin /tmp/jsmin.c

      - name: jsmin equivalence (minified JS must be the same program)
        env:
          JSMIN: /tmp/jsmin
        run: |
          set -eu
          files=$(find luci-app-footstrap-updater/htdocs -name '*.js' | sort | tr '\n' ' ')
          [ -n "$files" ] || { echo "found no shipped JS"; exit 1; }
          node tools/jsmin-verify.mjs $files

  build:
    needs: [check, lint]
    name: Build ${{ matrix.fmt }} (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fmt: apk
            channel: '25.12'
            fallback: '25.12.5'
            use_apk: 'y'
            sdk_key: 'b5043e70f9a75cde'
            sdk_key_sha256: 'd7ac10f9ed1b38033855f3d27c9327d558444fca804c685b17d9dcfb0648228f'
          - fmt: ipk
            channel: '24.10'
            fallback: '24.10.4'
            use_apk: 'n'
            sdk_key: 'd310c6f2833e97f7'
            sdk_key_sha256: 'e3624aa9be785362a172595b4919b233268871c4365a9b8da2b42ac41745ad95'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "FOOTSTRAP_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "FOOTSTRAP_VERSION=0.$(date +%y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Clone the theme (dependency resolution only)
        run: git clone --depth 1 --branch "$THEME_REF" "$THEME_REPO" "$RUNNER_TEMP/theme"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y zstd xz-utils rsync

      - name: Download OpenWrt SDK
        run: |
          set -euo pipefail
          CH_RE="$(printf '%s' '${{ matrix.channel }}' | sed 's/\./\\./g')"
          LATEST="$(curl -sfL 'https://downloads.openwrt.org/releases/' \
            | grep -oE "${CH_RE}\.[0-9]+" | sort -V | uniq | tail -n1)" || LATEST=''
          [ -n "$LATEST" ] || { LATEST='${{ matrix.fallback }}'; echo "release listing failed; falling back"; }
          echo "Using OpenWrt release: $LATEST"
          BASE="https://downloads.openwrt.org/releases/$LATEST/targets/x86/64"

          SDK_FILE="$(curl -sfL "$BASE/" | grep -oE 'openwrt-sdk-[^"<]+\.tar\.(zst|xz)' | head -n1)" || SDK_FILE=''
          [ -n "$SDK_FILE" ] || { echo "SDK filename not found at $BASE"; exit 1; }
          echo "Using SDK: $SDK_FILE"
          curl -fL --proto '=https' --proto-redir '=https' "$BASE/$SDK_FILE" -o "$RUNNER_TEMP/sdk.tar"

          # Verify the SDK: signature first (a key pinned from github.com/openwrt/keyring, a DIFFERENT
          # host than downloads.openwrt.org, so the download host cannot vouch for itself), then the
          # checksum under it. The two branches do NOT share a signing key. See luci-upstream.pin.
          . luci-upstream.pin
          U="$(tools/build-usign.sh "$RUNNER_TEMP/usign")"

          curl -sfL --proto '=https' --proto-redir '=https' "$BASE/sha256sums" -o "$RUNNER_TEMP/sha256sums"
          curl -sfL --proto '=https' --proto-redir '=https' "$BASE/sha256sums.sig" -o "$RUNNER_TEMP/sha256sums.sig"
          curl -sfL --proto '=https' --proto-redir '=https' \
            "https://raw.githubusercontent.com/openwrt/keyring/$OPENWRT_KEYRING_PIN/usign/${{ matrix.sdk_key }}" \
            -o "$RUNNER_TEMP/openwrt.pub"
          echo "${{ matrix.sdk_key_sha256 }}  $RUNNER_TEMP/openwrt.pub" | sha256sum -c - \
            || { echo "OpenWrt's ${{ matrix.channel }} key does not match its pin — refusing"; exit 1; }

          "$U" -V -m "$RUNNER_TEMP/sha256sums" -p "$RUNNER_TEMP/openwrt.pub" -x "$RUNNER_TEMP/sha256sums.sig" \
            || { echo "BAD SIGNATURE on OpenWrt's sha256sums — refusing to build with this SDK."; \
                 echo "keynum the signature names:"; \
                 sed -n 2p "$RUNNER_TEMP/sha256sums.sig" | base64 -d | xxd -s2 -l8 -p; \
                 echo "matrix.sdk_key: ${{ matrix.sdk_key }}"; exit 1; }
          echo "OpenWrt sha256sums: signature verified with ${{ matrix.sdk_key }}."

          WANT="$(grep -F " *$SDK_FILE" "$RUNNER_TEMP/sha256sums" | cut -d' ' -f1)" || WANT=''
          [ -n "$WANT" ] || { echo "no sha256 published for $SDK_FILE"; exit 1; }
          GOT="$(sha256sum "$RUNNER_TEMP/sdk.tar" | cut -d' ' -f1)"
          [ "$WANT" = "$GOT" ] || { echo "SDK checksum mismatch: want $WANT, got $GOT"; exit 1; }
          echo "SDK sha256 verified against the signed list."

          case "$SDK_FILE" in
            *.zst) tar --zstd -xf "$RUNNER_TEMP/sdk.tar" -C "$RUNNER_TEMP" ;;
            *.xz)  tar -xJf   "$RUNNER_TEMP/sdk.tar" -C "$RUNNER_TEMP" ;;
          esac
          SDK_DIR="$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'openwrt-sdk*' | head -n1)"
          [ -n "$SDK_DIR" ] || { echo "SDK dir not found"; exit 1; }
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Build package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -euo pipefail
          # both package dirs into the SDK: the updater (this repo) is what we ship; the theme (cloned)
          # is present ONLY so +luci-theme-footstrap resolves. Only the updater asset is uploaded.
          mkdir -p package/luci-app-footstrap-updater package/luci-theme-footstrap
          rsync -a --delete "$GITHUB_WORKSPACE/luci-app-footstrap-updater/" package/luci-app-footstrap-updater/
          rsync -a --delete "$RUNNER_TEMP/theme/luci-theme-footstrap/" package/luci-theme-footstrap/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo 'CONFIG_PACKAGE_luci-app-footstrap-updater=m' >> .config
          if [ "${{ matrix.use_apk }}" = "y" ]; then
            echo 'CONFIG_USE_APK=y' >> .config
          fi
          make defconfig
          make package/luci-app-footstrap-updater/compile V=s FOOTSTRAP_VERSION="$FOOTSTRAP_VERSION"

          # The translation catalogue is compiled INTO the package (Build/Prepare -> po2lmo); a silently
          # missing .lmo ships the updater untranslated. Assert it exists in the staged tree.
          find build_dir -name 'footstrap-updater.*.lmo' | grep -q . || {
            echo "no footstrap-updater.<lang>.lmo — the updater would ship untranslated"; exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/ -type f \( -name 'luci-app-footstrap-updater-*.apk' -o -name 'luci-app-footstrap-updater_*.ipk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -lah "$GITHUB_WORKSPACE/dist"

          # EXACTLY ONE updater asset per format, by NAME. A self-updater in the field resolves the
          # updater by /luci-app-footstrap-updater[-_][^/]*\.EXT$/ and takes head -1, so a stray extra
          # asset matching that regex would be mis-picked (issue #6). Named-and-counted stops that.
          n=$(ls "$GITHUB_WORKSPACE/dist" | grep -cE "^luci-app-footstrap-updater[-_][^/]*\.${{ matrix.fmt }}$" || true)
          [ "$n" = 1 ] || { echo "expected exactly 1 updater .${{ matrix.fmt }}, got $n"; ls "$GITHUB_WORKSPACE/dist"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-footstrap-updater-${{ matrix.fmt }}
          path: dist/*.${{ matrix.fmt }}
          if-no-files-found: error

  release:
    name: Attach package to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The notes are an ASSET now (dist/notes.md), not just the release body: the confirm dialog
      # reads them from the release, which used to mean `@.body` and therefore api.github.com.
      - name: Build release notes from the CHANGELOG
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          sh tools/release-notes.sh "$ver" > "$RUNNER_TEMP/notes.md"
          mkdir -p dist
          cp "$RUNNER_TEMP/notes.md" dist/notes.md
          cat "$RUNNER_TEMP/notes.md"

      # The installer as a release asset. The documented one-liner used to fetch it from
      # raw.githubusercontent.com, which GitHub rate-limits for unauthenticated callers (changelog
      # 2025-05-08) — the same budget whose exhaustion is issue #17. Release assets have none.
      - name: Stage the installer as an asset
        run: cp install.sh dist/install.sh

      # owfeed is verified against the build attestation from its own release workflow before it
      # runs. It is about to hold the key that signs this release.
      - uses: owfeed/owfeed/setup@v0.3.2
        with:
          version: v0.3.2

      # `owfeed release` walks dist/<arch>/, because an apk's filename carries no architecture —
      # in a feed the architecture IS the directory. The SDK build leaves both packages flat, so
      # sort them by the architecture each one declares: apk says noarch, ipk says all, and the
      # two spellings are not interchangeable (apk rejects `all` as uninstallable, opkg has never
      # heard of `noarch`).
      - name: Sort the packages by the architecture they declare
        run: |
          set -euo pipefail
          mkdir -p dist/noarch dist/all
          for f in dist/*.apk; do [ -e "$f" ] && mv "$f" dist/noarch/; done
          for f in dist/*.ipk; do [ -e "$f" ] && mv "$f" dist/all/; done
          ls -R dist

      # Sign each package with this repository's own EC key, BEFORE the manifest is written:
      # `owfeed release` records every package's size and sha256, and signing appends bytes, so
      # the other order would describe files that no longer exist.
      #
      # A different claim from the usign signature below. usign signs the manifest — an inventory
      # checked once by whoever ingests the release. This goes inside the .apk and reaches the
      # router, where anyone holding the public half can confirm who built the package without
      # trusting the feed that served it. owfeed-packages requires it: a package it cannot
      # attribute is one it refuses to publish.
      - name: Sign the packages with this repository's key
        env:
          OWFEED_AUTHOR_KEY: ${{ secrets.OWFEED_AUTHOR_KEY }}
        run: |
          set -euo pipefail
          [ -n "${OWFEED_AUTHOR_KEY:-}" ] || {
            echo "OWFEED_AUTHOR_KEY is not set. The feed refuses a package signed by nobody,"
            echo "so this release would not be carried."
            exit 1
          }
          owfeed sign --key env:OWFEED_AUTHOR_KEY dist

      # THE MANIFEST — see the theme repo's build.yml for the full reasoning. Short version: every
      # value the self-updater used to read out of api.github.com (tag, asset name, size, sha256)
      # goes into one signed text file served from the release CDN, which has no per-IP request
      # budget. `repo` is in it and the reader checks it: ONE key signs both repos' manifests, so
      # without that line the theme's manifest would verify perfectly as this one.
      # THE MANIFEST AND THE SIGNATURES — one `owfeed release`, where this job used to hand-roll
      # both: a shell loop that formatted manifest.txt, and a second that built usign from source
      # and signed each file. Same key, same signature, same line-oriented format — the readers
      # already in the field parse `pkg` positionally and never look at the first line, so the
      # format identifier changing from footstrap-manifest to owfeed-manifest is invisible to
      # them, and the seventh token owfeed adds sits past the three they read.
      #
      # WHAT THE MANIFEST IS FOR: it takes api.github.com out of the install and update path. Every
      # value the self-updater used to read from the release API — the tag, each asset's name, size
      # and sha256 — is one small signed text file on the release CDN, which has no per-IP budget.
      #
      # WHY THE SIGNATURE IS NOT REDUNDANT WITH GitHub's sha256: GitHub recomputes its digest from
      # whatever was uploaded, so a replaced asset gets a matching digest. The signing key is not in
      # the repository and a secret cannot be read back out, so the same swap fails here.
      #
      # `repo` is in the file and readers check it. One usign key signs both repositories'
      # manifests, so without that line the theme's manifest would verify perfectly as this one.
      #
      # It runs in the RELEASE job: the build job also runs on pull_request, and a secret must
      # never be reachable from a fork.
      - name: Build and sign the release manifest
        env:
          FOOTSTRAP_USIGN_KEY: ${{ secrets.FOOTSTRAP_USIGN_KEY }}
        run: |
          set -euo pipefail
          [ -n "${FOOTSTRAP_USIGN_KEY:-}" ] || {
            echo "FOOTSTRAP_USIGN_KEY is not set — a release without a signature is one no current"
            echo "installer will accept. Refusing to publish."
            exit 1
          }
          # The secret is base64 of usign's two-line secret-key file — one canonical form, so
          # nothing has to guess whether newlines survived a copy-paste. owfeed wants the file
          # itself. It never touches the disk: a step-scoped env var is not in the process table.
          #
          # --sign-also carries the installer, which is not a package and does not belong in the
          # inventory. It is signed because it is executable code handed to root: nothing can check
          # that during `curl | sh`, so it is not a link in the install chain — it lets a careful
          # admin verify the installer out of band.
          OWFEED_RELEASE_KEY="$(printf '%s' "$FOOTSTRAP_USIGN_KEY" | base64 -d)" \
            owfeed release --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
                           --sign-also install.sh
          cat dist/manifest.txt

      # Flatten, then verify every signature with the key the router will use.
      #
      # owfeed leaves the packages in dist/noarch and dist/all; a release asset has no directory at
      # all, and the manifest names files without paths, which is what a router asks for.
      #
      # The verify is not ceremony: a secret rotated in GitHub without the public half being
      # committed would publish a release every installer rejects, and the rejection reads "BAD
      # SIGNATURE" — indistinguishable from the attack the signature exists to stop.
      - name: Verify what is about to be published
        run: |
          set -euo pipefail
          for f in dist/*/*.apk dist/*/*.ipk dist/*/*.sig; do
            [ -e "$f" ] || continue
            mv "$f" dist/
          done
          rmdir dist/*/ 2>/dev/null || true
          ls -l dist

          U="$(tools/build-usign.sh "$RUNNER_TEMP/usign")"
          pub=luci-app-footstrap-updater/root/usr/share/luci-app-footstrap-updater/release.pub
          n=0
          for p in dist/*.apk dist/*.ipk dist/manifest.txt dist/install.sh; do
            [ -e "$p" ] || continue
            [ -s "$p.sig" ] || { echo "no signature for $(basename "$p")"; exit 1; }
            "$U" -V -q -m "$p" -x "$p.sig" -p "$pub" || {
              echo "signature does not verify against $pub — the secret and the shipped key disagree"
              exit 1
            }
            echo "verified: $(basename "$p")"
            n=$((n + 1))
          done
          # 4: the updater in each of apk and ipk, plus manifest.txt and install.sh.
          [ "$n" -ge 4 ] || { echo "expected 4 signed files, found $n"; exit 1; }
          [ -s dist/manifest.txt.sig ] || { echo "manifest.txt.sig was not produced"; exit 1; }

          # Re-check the name-anchored one-asset invariant on the FINAL set (a .sig ends in
          # .EXT.sig, so it never matches `…\.EXT$`). A fielded self-updater picks the updater by
          # this regex + head -1.
          for ext in apk ipk; do
            re="^luci-app-footstrap-updater[-_][^/]*\.$ext$"
            n=$(ls dist | grep -cE "$re") || true
            [ "$n" = 1 ] || { echo "a fielded self-updater matching /$re/ would pick $n assets, want 1:"; ls dist | grep -E "$re" || true; exit 1; }
          done
          ls -l dist

      # Pinned by COMMIT, not the v3 tag: the only third-party action, in the only job holding
      # contents: write. It never sees the signing secret (step-scoped env). (= tag v3.)
      #
      # PUBLISHED AS A DRAFT, then flipped below. `latest` moves to a release the moment it is
      # published, and this action creates the release FIRST and uploads assets after — so a router
      # polling in that window resolves `releases/latest/download/manifest.txt` against a release
      # that has no manifest yet, and reports a hard error. A draft is not `latest`.
      - name: Attach to release (draft)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          draft: true

      # The one instant at which `latest` moves — everything a router fetches is already uploaded.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          # Prove the manifest resolves from the URL a router actually uses. A 404 here means every
          # update check would have failed, and this is the last moment it is still a red build.
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 2 -o "$RUNNER_TEMP/mf.check" \
                 "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.txt"; then
              break
            fi
            [ "$i" = 5 ] && { echo "releases/latest/download/manifest.txt does not resolve"; exit 1; }
            sleep 5
          done
          diff -u dist/manifest.txt "$RUNNER_TEMP/mf.check" || {
            echo "the manifest served by latest/download is not the one we just built"; exit 1; }
          echo "manifest.txt resolves through releases/latest/download and matches."

  # Refresh the Pages mirror of the release (manifest + signature + notes + the packages) now that
  # the release is published. Called, not triggered: `on: release` never fires for a release created
  # with GITHUB_TOKEN.
  pages:
    name: Refresh the Pages mirror
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
